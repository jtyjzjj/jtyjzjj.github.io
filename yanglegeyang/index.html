<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#5dcf4f" />
<meta name="format-detection" content="telephone=no" />
<title>羊了个羊</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23fff6e8'/%3E%3Ccircle cx='32' cy='36' r='14' fill='%235d4037'/%3E%3Ccircle cx='26' cy='34' r='2' fill='%23fff'/%3E%3Ccircle cx='38' cy='34' r='2' fill='%23fff'/%3E%3C/svg%3E" />
<style>
  :root {
    --grass-1: #9be86c;
    --grass-2: #57c44a;
    --grass-3: #3ea338;
    --wood: #c9954a;
    --wood-dark: #8a5a22;
    --cream: #fffaf1;
    --gold: #ffd95a;
    --ink: #3b2a14;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    background: #121212;
    color: var(--ink);
    user-select: none;
    touch-action: manipulation;
    overscroll-behavior: none;
  }
  body { display: flex; align-items: center; justify-content: center; }
  #phone {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 100%;
    background: #57c44a;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  @media (min-width: 520px) {
    #phone {
      width: 390px;
      height: min(844px, calc(100vh - 24px));
      max-height: 844px;
      border-radius: 40px;
      border: 10px solid #1a1a1a;
      box-shadow: 0 0 0 2px #333, 0 30px 80px rgba(0,0,0,.55), inset 0 0 0 2px #2c2c2c;
    }
    #phone::before {
      content: "";
      position: absolute;
      top: 8px; left: 50%;
      transform: translateX(-50%);
      width: 120px; height: 18px;
      background: #1a1a1a;
      border-radius: 0 0 12px 12px;
      z-index: 80;
      pointer-events: none;
    }
    #screen-start { padding-top: 40px; }
    #screen-levels { padding-top: 40px; }
    #screen-game { padding-top: 28px; }
  }
  .meadow {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 90% 50% at 50% -10%, #c8f58a 0%, transparent 50%),
      linear-gradient(180deg, #89e465 0%, #5dcf4f 32%, #49b340 68%, #3a9a34 100%);
  }
  .meadow::after {
    content: "";
    position: absolute; inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='24'><path d='M2 20c4-8 8-8 12 0' stroke='%234caf50' stroke-width='1.4' fill='none' opacity='.35'/><path d='M22 22c3-7 7-7 11 0' stroke='%233d8b40' stroke-width='1.2' fill='none' opacity='.28'/></svg>");
    opacity: .55;
    pointer-events: none;
  }
  .cloud {
    position: absolute;
    background: #fff;
    border-radius: 40px;
    opacity: .88;
    filter: drop-shadow(0 6px 8px rgba(0,0,0,.08));
    animation: drift 22s linear infinite;
    pointer-events: none;
  }
  .cloud:nth-child(1) { width: 90px; height: 28px; top: 8%; left: -20%; animation-duration: 28s; }
  .cloud:nth-child(2) { width: 70px; height: 22px; top: 16%; left: -30%; animation-duration: 34s; animation-delay: -12s; }
  .cloud:nth-child(3) { width: 110px; height: 32px; top: 11%; left: -10%; animation-duration: 40s; animation-delay: -20s; opacity: .7; }
  .cloud::before, .cloud::after {
    content: ""; position: absolute; background: #fff; border-radius: 50%;
  }
  .cloud::before { width: 36px; height: 36px; top: -16px; left: 16px; }
  .cloud::after { width: 24px; height: 24px; top: -10px; right: 18px; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(160vw); } }

  .screen {
    position: absolute; inset: 0;
    display: none;
    flex-direction: column;
    z-index: 2;
  }
  .screen.active { display: flex; }

  /* ===== Start ===== */
  #screen-start { align-items: center; padding: calc(24px + var(--safe-top)) 24px calc(24px + var(--safe-bot)); }
  .logo-wrap { margin-top: 8vh; text-align: center; position: relative; z-index: 3; }
  .logo {
    font-size: clamp(48px, 14vw, 64px);
    font-weight: 900;
    letter-spacing: 4px;
    color: #fff8d6;
    text-shadow:
      0 3px 0 #f3c63a,
      0 6px 0 #e09a12,
      0 9px 0 #c47a0a,
      0 14px 20px rgba(80,40,0,.28);
    animation: logoPop .8s cubic-bezier(.2,1.4,.3,1) both;
  }
  .logo-en { margin-top: 6px; font-size: 13px; letter-spacing: 6px; color: rgba(255,255,255,.85); font-weight: 700; }
  .tagline { margin-top: 10px; font-size: 14px; color: #2d6a24; font-weight: 600; }
  @keyframes logoPop { from { transform: scale(.6) rotate(-6deg); opacity: 0; } }

  .hero-sheep { width: 210px; height: 210px; margin: 18px auto 8px; animation: bob 2.6s ease-in-out infinite; filter: drop-shadow(0 18px 12px rgba(0,0,0,.18)); }
  .hero-sheep svg, .ad-sheep svg { width: 100%; height: 100%; display: block; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

  .btn {
    border: 0; cursor: pointer; font: inherit; font-weight: 800;
    border-radius: 999px; padding: 14px 28px;
    box-shadow: 0 6px 0 rgba(0,0,0,.18), 0 10px 18px rgba(0,0,0,.12);
    transition: transform .12s, box-shadow .12s, filter .12s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.18); }
  .btn-main {
    background: linear-gradient(180deg, #ffe57a, #ffc107);
    color: #6a3e00; font-size: 20px; min-width: 220px;
    margin-top: 8px;
  }
  .btn-ghost {
    background: rgba(255,255,255,.88);
    color: #2f6b28; font-size: 15px; min-width: 220px; margin-top: 12px;
  }
  .start-actions { display: flex; flex-direction: column; align-items: center; margin-top: auto; z-index: 3; padding-bottom: 12px; }
  .stats-line { margin-top: 14px; font-size: 12px; color: #24601e; opacity: .9; }

  /* ===== Levels ===== */
  #screen-levels { padding: calc(18px + var(--safe-top)) 18px calc(18px + var(--safe-bot)); }
  .nav-row { display: flex; align-items: center; gap: 10px; z-index: 3; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(255,255,255,.9); color: #3b2a14; font-size: 18px; font-weight: 800;
    box-shadow: 0 3px 0 rgba(0,0,0,.12);
  }
  .screen-title { font-size: 22px; font-weight: 900; color: #fff8d6; text-shadow: 0 2px 0 #d4a017, 0 6px 10px rgba(0,0,0,.2); }
  .level-list { margin-top: 22px; display: flex; flex-direction: column; gap: 14px; z-index: 3; overflow: auto; }
  .level-card {
    background: linear-gradient(180deg, #fffdf7, #f6ead3);
    border-radius: 20px; padding: 16px 16px 14px;
    box-shadow: 0 8px 0 #c9a36a, 0 14px 20px rgba(0,0,0,.15);
    display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center;
    cursor: pointer; border: 2px solid #f0e0c0;
  }
  .level-card:active { transform: translateY(4px); box-shadow: 0 4px 0 #c9a36a; }
  .level-badge {
    width: 64px; height: 64px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center; font-size: 30px;
    background: linear-gradient(180deg, #fff, #ffe082);
  }
  .level-card h3 { font-size: 18px; }
  .level-card p { font-size: 12px; color: #7a6240; margin-top: 4px; line-height: 1.4; }
  .stars { color: #f5a623; font-size: 14px; letter-spacing: 1px; }
  .go-chip { background: #ffca28; color: #6a3e00; font-weight: 800; border-radius: 999px; padding: 8px 12px; font-size: 13px; }

  /* ===== Game ===== */
  #screen-game { padding-top: var(--safe-top); }
  .hud {
    position: relative; z-index: 5;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px 6px;
  }
  .hud-left, .hud-right { display: flex; align-items: center; gap: 8px; }
  .pill {
    background: rgba(255,255,255,.92);
    border-radius: 999px; padding: 6px 10px;
    font-size: 12px; font-weight: 800; color: #4a3318;
    box-shadow: 0 2px 0 rgba(0,0,0,.1);
    display: flex; align-items: center; gap: 4px;
  }
  .pill.warn { background: #ffecb3; color: #c62828; animation: pulse 1s ease infinite; }
  @keyframes pulse { 50% { transform: scale(1.04); } }
  .combo-flag {
    position: absolute; left: 50%; top: 52px; transform: translateX(-50%) scale(.6);
    opacity: 0; pointer-events: none; z-index: 20;
    font-size: 22px; font-weight: 900; color: #fff8d6;
    text-shadow: 0 3px 0 #e09a12, 0 8px 12px rgba(0,0,0,.25);
    transition: none;
  }
  .combo-flag.show { animation: comboPop .7s ease; }
  @keyframes comboPop {
    0% { opacity: 0; transform: translate(-50%, 8px) scale(.6); }
    25% { opacity: 1; transform: translate(-50%, 0) scale(1.15); }
    70% { opacity: 1; transform: translate(-50%, -6px) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -18px) scale(.9); }
  }

  .stage-wrap {
    position: relative; flex: 1; min-height: 0;
    margin: 0 6px;
  }
  #stage {
    position: absolute; inset: 0;
    overflow: visible;
  }
  .tile {
    position: absolute;
    border-radius: 11px;
    cursor: pointer;
    touch-action: none;
  }
  .tile-face {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, #fffefb 0%, #fff4df 100%);
    border: 3px solid #f3e2c0;
    border-radius: 11px;
    box-shadow:
      inset 0 1px 0 #fff,
      0 3px 0 #d7b48a,
      0 7px 10px rgba(50, 30, 10, .22);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .tile-face svg { width: 68%; height: 68%; pointer-events: none; }
  .tile.covered { cursor: default; }
  .tile.covered .tile-face {
    filter: brightness(.62) saturate(.75);
    box-shadow: 0 2px 0 #b89a72, 0 5px 8px rgba(0,0,0,.16);
  }
  .tile.covered .tile-mask {
    position: absolute; inset: 0; border-radius: 11px;
    background: rgba(35, 55, 28, .32);
    pointer-events: none;
  }
  .tile.clickable .tile-face { filter: brightness(1.04); }
  .tile.shake { animation: shake .28s ease; }
  @keyframes shake {
    0%,100% { transform: translateX(0) rotate(0); }
    20% { transform: translateX(-7px) rotate(-4deg); }
    40% { transform: translateX(7px) rotate(4deg); }
    60% { transform: translateX(-5px) rotate(-3deg); }
    80% { transform: translateX(5px) rotate(3deg); }
  }
  .tile.hint .tile-face {
    animation: hintGlow .9s ease infinite;
  }
  @keyframes hintGlow {
    50% { box-shadow: inset 0 1px 0 #fff, 0 3px 0 #d7b48a, 0 0 0 4px rgba(255, 230, 80, .7); }
  }
  .tile.in-slot {
    position: relative; left: auto !important; top: auto !important;
    width: 100% !important; height: 100% !important;
    transform: none !important;
    cursor: default;
    filter: none;
  }
  .tile.in-slot .tile-face { box-shadow: inset 0 1px 0 #fff, 0 2px 0 #d7b48a; }
  .tile.flying { pointer-events: none; z-index: 50 !important; }

  .dock {
    position: relative; z-index: 6;
    padding: 6px 12px calc(12px + var(--safe-bot));
  }
  .slot-tray {
    background:
      repeating-linear-gradient(90deg, transparent 0 7px, rgba(90,45,10,.1) 7px 8px),
      linear-gradient(180deg, #e2b36a 0%, #c48a3a 55%, #a56b28 100%);
    border-radius: 16px;
    padding: 10px 8px 12px;
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,.35),
      inset 0 -4px 0 rgba(0,0,0,.18),
      0 8px 0 #7a4e1a;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
  }
  .slot-tray.danger {
    animation: trayShake .4s ease;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.35), 0 8px 0 #7a4e1a, 0 0 0 3px #ff5252;
  }
  @keyframes trayShake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-5px); }
    40% { transform: translateX(5px); }
    60% { transform: translateX(-3px); }
    80% { transform: translateX(3px); }
  }
  .slot-cell {
    aspect-ratio: 7 / 8;
    background: rgba(80, 40, 8, .28);
    border-radius: 8px;
    box-shadow: inset 0 2px 4px rgba(0,0,0,.25);
    position: relative;
  }
  .tools {
    margin-top: 12px;
    display: flex; justify-content: space-around; align-items: flex-start;
  }
  .tool {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: none; border: 0; cursor: pointer; font: inherit; color: #fff;
  }
  .tool-ico {
    width: 54px; height: 54px; border-radius: 50%;
    background: linear-gradient(180deg, #fff, #ffe082);
    box-shadow: 0 4px 0 #e0a21a, 0 8px 12px rgba(0,0,0,.16);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; position: relative;
  }
  .tool:active .tool-ico { transform: translateY(3px); box-shadow: 0 1px 0 #e0a21a; }
  .tool.disabled { opacity: .45; }
  .tool-count {
    position: absolute; top: -4px; right: -4px;
    min-width: 18px; height: 18px; padding: 0 5px;
    background: #ff5252; color: #fff; border-radius: 999px;
    font-size: 11px; font-weight: 800; line-height: 18px;
    box-shadow: 0 2px 0 #c62828;
  }
  .tool span { font-size: 12px; font-weight: 700; text-shadow: 0 1px 2px rgba(0,0,0,.3); }

  /* ===== Modals ===== */
  .overlay {
    position: absolute; inset: 0; z-index: 40;
    background: rgba(20, 40, 10, .45);
    display: none; align-items: center; justify-content: center;
    padding: 24px;
    backdrop-filter: blur(3px);
  }
  .overlay.show { display: flex; }
  .panel {
    width: min(320px, 100%);
    background: linear-gradient(180deg, #fffdf8, #f3e6c8);
    border-radius: 24px;
    padding: 22px 20px 18px;
    text-align: center;
    box-shadow: 0 16px 0 #c9a36a, 0 28px 40px rgba(0,0,0,.28);
    animation: popIn .35s cubic-bezier(.2,1.3,.3,1);
  }
  @keyframes popIn { from { transform: scale(.7); opacity: 0; } }
  .panel h2 { font-size: 26px; margin-bottom: 8px; }
  .panel p { font-size: 14px; color: #6b542e; line-height: 1.6; }
  .panel .big { font-size: 42px; margin-bottom: 6px; }
  .panel-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .stars-lg { color: #f5a623; font-size: 22px; margin: 8px 0; letter-spacing: 3px; }

  #ad-screen { background: #111; color: #fff; flex-direction: column; }
  .ad-stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  .ad-sheep { width: 160px; height: 160px; animation: dance 0.45s ease-in-out infinite alternate; }
  @keyframes dance {
    from { transform: rotate(-12deg) translateY(0); }
    to { transform: rotate(12deg) translateY(-12px); }
  }
  .ad-bar { width: 70%; height: 8px; background: #333; border-radius: 99px; overflow: hidden; }
  .ad-bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ffe57a, #ff9800); }
  .ad-bar > i.run { animation: adfill 3.2s linear forwards; }
  @keyframes adfill { to { width: 100%; } }
  .ad-skip {
    margin: 0 0 24px; background: #333; color: #aaa; border: 0; border-radius: 99px;
    padding: 10px 22px; font-weight: 700; font-size: 14px;
  }
  .ad-skip.ready { background: var(--gold); color: #6a3e00; }

  #toast {
    position: absolute; left: 50%; bottom: 40%;
    transform: translateX(-50%) translateY(10px);
    background: rgba(40, 28, 12, .92); color: #fff;
    padding: 12px 18px; border-radius: 99px; font-size: 15px; font-weight: 800;
    opacity: 0; pointer-events: none; z-index: 70; white-space: nowrap;
    transition: .25s ease;
    box-shadow: 0 8px 20px rgba(0,0,0,.25);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  #fx {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 30;
  }

  .flower {
    position: absolute; font-size: 18px; pointer-events: none; z-index: 1;
    animation: sway 3.4s ease-in-out infinite;
  }
  @keyframes sway { 50% { transform: rotate(12deg) translateY(-3px); } }

  .how-list { text-align: left; font-size: 13px; color: #5c4728; line-height: 1.7; margin: 8px 0 0; padding-left: 8px; }
  .how-list b { color: #3b2a14; }
</style>
</head>
<body>
<div id="phone">
  <div class="meadow"></div>
  <div class="cloud"></div>
  <div class="cloud"></div>
  <div class="cloud"></div>
  <div class="flower" style="left:8%; bottom:22%">🌼</div>
  <div class="flower" style="right:10%; bottom:28%; animation-delay:.6s">🌸</div>
  <div class="flower" style="left:16%; bottom:32%; animation-delay:1.1s">🌿</div>

  <div id="screen-start" class="screen active">
    <div class="logo-wrap">
      <div class="logo">羊了个羊</div>
      <div class="logo-en">SHEEP A SHEEP</div>
      <div class="tagline">三只一消 · 槽满就炸 · 小心理智</div>
    </div>
    <div class="hero-sheep" id="hero-sheep"></div>
    <div class="start-actions">
      <button class="btn btn-main" id="btn-start">开始游戏</button>
      <button class="btn btn-ghost" id="btn-how">玩法说明</button>
      <div class="stats-line" id="stats-line"></div>
    </div>
  </div>

  <div id="screen-levels" class="screen">
    <div class="nav-row">
      <button class="icon-btn" id="btn-back-home">←</button>
      <div class="screen-title">选择牧场</div>
    </div>
    <div class="level-list" id="level-list"></div>
  </div>

  <div id="screen-game" class="screen">
    <div class="hud">
      <div class="hud-left">
        <button class="icon-btn" id="btn-pause">←</button>
        <div class="pill" id="level-pill">新手牧场</div>
      </div>
      <div class="hud-right">
        <div class="pill" id="remain-pill">剩余 0</div>
        <div class="pill" id="score-pill">0</div>
        <button class="icon-btn" id="btn-mute" title="声音">🔊</button>
      </div>
    </div>
    <div class="combo-flag" id="combo-flag"></div>
    <div class="stage-wrap"><div id="stage"></div></div>
    <div class="dock">
      <div class="slot-tray" id="slot-tray">
        <div class="slot-cell"></div><div class="slot-cell"></div><div class="slot-cell"></div>
        <div class="slot-cell"></div><div class="slot-cell"></div><div class="slot-cell"></div>
        <div class="slot-cell"></div>
      </div>
      <div class="tools">
        <button class="tool" id="tool-undo">
          <div class="tool-ico">↩️<i class="tool-count">0</i></div>
          <span>撤回</span>
        </button>
        <button class="tool" id="tool-remove">
          <div class="tool-ico">📤<i class="tool-count">0</i></div>
          <span>移出</span>
        </button>
        <button class="tool" id="tool-shuffle">
          <div class="tool-ico">🔀<i class="tool-count">0</i></div>
          <span>洗牌</span>
        </button>
      </div>
    </div>
  </div>

  <div class="overlay" id="modal"></div>
  <div class="overlay" id="ad-screen"></div>
  <div id="toast"></div>
  <canvas id="fx"></canvas>
</div>

<script>
(function () {
  "use strict";

  const $ = (s, r=document) => r.querySelector(s);
  const $$ = (s, r=document) => [...r.querySelectorAll(s)];
  const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
  const wait = (ms) => new Promise(res => setTimeout(res, ms));
  const rand = (a, b) => a + Math.random() * (b - a);
  const choice = (arr) => arr[(Math.random() * arr.length) | 0];
  function shuffle(arr, rng=Math.random) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = (rng() * (i + 1)) | 0;
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
  function mulberry32(a) {
    return function () {
      let t = a += 0x6D2B79F5;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function todaySeed() {
    const d = new Date();
    return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
  }

  /* ---------- Icons ---------- */
  const svg = (inner) =>

  const Sfx = (() => {
    let ctx = null, muted = false, bgmId = 0;
    const ac = () => {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === "suspended") ctx.resume();
      return ctx;
    };
    function tone(freq, dur, type="sine", gain=0.07, delay=0) {
      if (muted) return;
      const c = ac(), t = c.currentTime + delay;
      const o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(gain, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(c.destination);
      o.start(t); o.stop(t + dur + 0.05);
    }
    const melody = [0,2,4,7,4,2,0,4, 7,4,7,9,7,4,2,0];
    const scale = [523.25, 587.33, 659.25, 698.46, 783.99, 880, 987.77, 1046.5];
    function tickBgm(step) {
      if (muted) return;
      const n = melody[step % melody.length];
      tone(scale[n] / 2, 0.18, "triangle", 0.025);
      if (step % 4 === 0) tone(196, 0.12, "sine", 0.02);
    }
    return {
      unlock() { try { ac(); } catch(e) {} },
      pick() { tone(720, 0.07, "triangle", 0.06); },
      deny() { tone(180, 0.1, "square", 0.04); },
      match() { tone(523, 0.1, "sine", 0.08, 0); tone(659, 0.1, "sine", 0.08, 0.07); tone(784, 0.18, "sine", 0.09, 0.14); },
      combo() { tone(880, 0.12, "triangle", 0.07); tone(1174, 0.16, "sine", 0.05, 0.08); },
      win() { [523,659,784,1046].forEach((f,i) => tone(f, 0.22, "sine", 0.09, i * 0.11)); },
      lose() { tone(320, 0.18, "sawtooth", 0.05, 0); tone(196, 0.35, "sawtooth", 0.05, 0.16); },
      tool() { tone(480, 0.08, "square", 0.04); tone(640, 0.1, "square", 0.04, 0.07); },

      toggle() {

        return muted;
      },
      startBgm() {
        if (muted || bgmId) return;
        let step = 0;
        bgmId = setInterval(() => tickBgm(step++), 380);

      stopBgm() { clearInterval(bgmId); bgmId = 0; }

  function burst(x, y, color, n=16) {
    const phone = $("#phone").getBoundingClientRect();
    x = (x - phone.left) * devicePixelRatio;
    y = (y - phone.top) * devicePixelRatio;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = rand(1.2, 5) * devicePixelRatio;
      particles.push({
        x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 2*devicePixelRatio,
        life: 1, color, s: rand(2, 5) * devicePixelRatio
      });
    }
  }
  function confetti() {
    const w = fx.width, h = fx.height;
    for (let i = 0; i < 80; i++) {
      particles.push({
        x: Math.random()*w, y: -10, vx: rand(-1,1)*devicePixelRatio,
        vy: rand(2, 6)*devicePixelRatio, life: 1.4,
        color: choice(["#ffd54f","#ef5350","#66bb6a","#42a5f5","#ab47bc","#fff"]),
        s: rand(3, 6)*devicePixelRatio
      });
    }
  }
  (function loop() {
    fxc.clearRect(0, 0, fx.width, fx.height);
    particles = particles.filter(p => p.life > 0);
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy; p.vy += 0.12*devicePixelRatio; p.life -= 0.02;
      fxc.globalAlpha = clamp(p.life, 0, 1);
      fxc.fillStyle = p.color;
      fxc.beginPath(); fxc.arc(p.x, p.y, p.s, 0, Math.PI*2); fxc.fill();
    }
    fxc.globalAlpha = 1;
    requestAnimationFrame(loop);
  })();

  function isCovered(tile) {
    if (tile.status !== "board") return false;
    const pad = Math.min(tile.w, tile.h) * 0.2;
    for (const o of G.tiles) {
      if (o === tile || o.status !== "board" || o.layer <= tile.layer) continue;
      const x = Math.min(tile.x + tile.w, o.x + o.w) - Math.max(tile.x, o.x);
      const y = Math.min(tile.y + tile.h, o.y + o.h) - Math.max(tile.y, o.y);
      if (x > pad && y > pad) return true;
    }
    return false;
  }

  function layoutTiles() {
    const board = G.tiles.filter(t => t.status === "board");
    if (!board.length) return;
    const areaW = stage.clientWidth;
    const areaH = stage.clientHeight;
    if (areaW < 20 || areaH < 20) {
      requestAnimationFrame(() => { layoutTiles(); updateCovered(); });
      return;
    }
    let minC = Infinity, maxC = -Infinity, minR = Infinity, maxR = -Infinity;
    for (const t of G.tiles) {
      minC = Math.min(minC, t.col); maxC = Math.max(maxC, t.col);
      minR = Math.min(minR, t.row); maxR = Math.max(maxR, t.row);
    }
    const GRID_X = 30, GRID_Y = 32, TW = 56, TH = 64;
    const rawW = (maxC - minC) * GRID_X + TW;
    const rawH = (maxR - minR) * GRID_Y + TH;
    const scale = Math.min(areaW / rawW, areaH / rawH) * 0.96;
    const ox = (areaW - rawW * scale) / 2;
    const oy = (areaH - rawH * scale) / 2;
    for (const t of G.tiles) {
      t.w = TW * scale;
      t.h = TH * scale;
      t.x = ox + (t.col - minC) * GRID_X * scale;
      t.y = oy + (t.row - minR) * GRID_Y * scale;
      t.homeX = t.x; t.homeY = t.y;

  function scheduleHint() {
    clearTimeout(G.hintTimer);
    $$(".tile.hint").forEach(el => el.classList.remove("hint"));
    G.hintTimer = setTimeout(() => {
      if (G.over || G.busy) return;
      const open = G.tiles.filter(t => t.status === "board" && !isCovered(t));
      if (!open.length) return;
      const prefer = open.find(t => G.slot.some(s => s.type === t.type)) || choice(open);
      prefer.el.classList.add("hint");
    }, 9000);
  }

  function showCombo(n) {
    const el = $("#combo-flag");
    const words = ["消除!", "连击!", "漂亮!", "太强了!", "羊村传说!", "无敌!"];
    el.textContent = n <= 1 ? "消除!" : (words[Math.min(n, words.length) - 1] + " x" + n);
    el.classList.remove("show");
    void el.offsetWidth;
    el.classList.add("show");
  }

  async function flyTo(el, destRect) {
    const r = el.getBoundingClientRect();
    el.classList.add("flying");
    el.style.position = "fixed";
    el.style.left = (r.left) + "px";
    el.style.top = (r.top) + "px";
    el.style.width = r.width + "px";
    el.style.height = r.height + "px";
    el.style.margin = "0";
    el.style.zIndex = "80";
    el.style.transition = "left .34s cubic-bezier(.2,.8,.2,1), top .34s cubic-bezier(.2,.8,.2,1), width .34s, height .34s";
    phone.appendChild(el);
    void el.offsetWidth;
    el.style.left = destRect.left + "px";
    el.style.top = destRect.top + "px";
    el.style.width = destRect.width + "px";
    el.style.height = destRect.height + "px";
    await wait(360);
    el.classList.remove("flying");
    el.style.transition = "";
  }

  function slotCellRect(index) {
    const cells = $$(".slot-cell", slotTray);
    const i = clamp(index, 0, cells.length - 1);
    return cells[i].getBoundingClientRect();
  }

  function findMatch() {
    const counts = new Map();
    for (const t of G.slot) counts.set(t.type, (counts.get(t.type) || 0) + 1);
    for (const [type, n] of counts) {
      if (n >= 3) return { tiles: G.slot.filter(t => t.type === type).slice(0, 3) };
    }
    return null;
  }

  async function animateMatch(group) {
    Sfx.match();
    vibrate([12, 40, 12]);
    const color = TYPES[group.tiles[0].type].color;
    for (const t of group.tiles) {
      const r = t.el.getBoundingClientRect();
      burst(r.left + r.width/2, r.top + r.height/2, color, 14);
      t.el.style.transition = "transform .28s ease, opacity .28s ease";
      t.el.style.transform = "scale(0.15) rotate(12deg)";
      t.el.style.opacity = "0";
    }
    await wait(280);
    for (const t of group.tiles) {
      t.status = "gone";
      t.el.remove();
    }
    G.slot = G.slot.filter(t => t.status !== "gone");
  }

  async function onTilePointer(tile) {
    if (G.busy || G.over) return;
    if (tile.status !== "board") return;
    if (isCovered(tile)) {
      Sfx.deny();
      tile.el.classList.remove("shake");
      void tile.el.offsetWidth;
      tile.el.classList.add("shake");
      toast("还被压着，点上面的牌～");
      return;
    }
    G.busy = true;
    clearTimeout(G.hintTimer);
    $$(".tile.hint").forEach(el => el.classList.remove("hint"));
    try {
      await pickTile(tile);
    } finally {
      G.busy = false;
      if (!G.over) scheduleHint();
    }
  }

  async function pickTile(tile) {
    Sfx.pick();
    vibrate(8);
    G.lastPick = tile;

    let insertAt = G.slot.length;
    for (let i = G.slot.length - 1; i >= 0; i--) {
      if (G.slot[i].type === tile.type) { insertAt = i + 1; break; }
    }

    tile.status = "flying";
    updateCovered();

    const dest = slotCellRect(Math.min(insertAt, 6));
    await flyTo(tile.el, dest);

    tile.status = "slot";
    G.slot.splice(insertAt, 0, tile);
    renderSlot();

    const matched = findMatch();
    if (matched) {
      G.combo += 1;
      const add = 30 * G.combo + 10;
      G.score += add;
      showCombo(G.combo);
      if (G.combo >= 2) Sfx.combo();
      await animateMatch(matched);
      renderSlot();
    } else {
      G.combo = 0;
    }

    updateHUD();

    const boardLeft = G.tiles.some(t => t.status === "board");
    if (!boardLeft && G.slot.length === 0) {
      await wait(200);
      return victory();
    }
    if (G.slot.length >= 7) {
      await wait(180);
      return defeat();
    }
  }

  /* ---------- Tools ---------- */
  function useUndo() {
    if (G.busy || G.over) return;
    if (G.tools.undo <= 0) return toast("撤回次数用完了");
    const t = G.lastPick;
    if (!t || t.status !== "slot") {
      Sfx.deny();
      return toast("上一手已消除，无法撤回");
    }
    G.tools.undo--;
    Sfx.tool();
    G.slot = G.slot.filter(s => s !== t);
    t.status = "board";
    t.el.classList.remove("in-slot");
    t.x = t.homeX; t.y = t.homeY;
    stage.appendChild(t.el);
    t.el.style.left = t.x + "px";
    t.el.style.top = t.y + "px";
    t.el.style.width = t.w + "px";
    t.el.style.height = t.h + "px";
    t.el.style.zIndex = String(t.layer * 80 + t.row * 2 + 2);
    G.lastPick = null;
    renderSlot();
    updateCovered();
    updateHUD();
  }

  function useRemove() {
    if (G.busy || G.over) return;
    if (G.tools.remove <= 0) return toast("移出次数用完了");
    if (!G.slot.length) { Sfx.deny(); return toast("槽位是空的"); }
    G.tools.remove--;
    Sfx.tool();
    const n = Math.min(3, G.slot.length);
    const moved = G.slot.splice(0, n);
    const maxLayer = G.tiles.reduce((m, t) => t.status === "board" ? Math.max(m, t.layer) : m, 0);
    const maxRow = G.tiles.reduce((m, t) => Math.max(m, t.row), 0);
    const sample = G.tiles.find(t => t.w) || moved[0];
    const tw = sample.w, th = sample.h, gap = 8;
    const total = n * tw + (n - 1) * gap;
    let x0 = (stage.clientWidth - total) / 2;
    const others = G.tiles.filter(t => t.status === "board");
    let y0 = others.length ? Math.max(...others.map(t => t.y + t.h)) + 8 : 12;
    if (y0 + th > stage.clientHeight - 4) y0 = Math.max(8, stage.clientHeight - th - 4);
    moved.forEach((t, i) => {
      t.status = "board";
      t.layer = maxLayer + 1;
      t.col = i * 2 + 1;
      t.row = maxRow + 3;
      t.w = tw; t.h = th;
      t.x = x0 + i * (tw + gap);
      t.y = y0;
      t.homeX = t.x; t.homeY = t.y;
      t.el.classList.remove("in-slot");
      t.el.style.cssText = "";
      t.el.style.left = t.x + "px";
      t.el.style.top = t.y + "px";
      t.el.style.width = t.w + "px";
      t.el.style.height = t.h + "px";
      t.el.style.zIndex = String(t.layer * 80 + 40);
      stage.appendChild(t.el);
    });
    G.lastPick = null;
    renderSlot();
    updateCovered();
    updateHUD();
  }

  function useShuffle() {
    if (G.busy || G.over) return;
    if (G.tools.shuffle <= 0) return toast("洗牌次数用完了");
    const remain = G.tiles.filter(t => t.status === "board");
    if (remain.length < 2) { Sfx.deny(); return toast("没有可洗的牌"); }
    G.tools.shuffle--;
    Sfx.tool();
    const types = remain.map(t => t.type);
    shuffle(types);
    remain.forEach((t, i) => {
      t.type = types[i];
      t.el.style.transition = "transform .25s";
      t.el.style.transform = "rotateY(90deg)";
      setTimeout(() => {
        paintTileIcon(t);
        t.el.style.transform = "rotateY(0)";
      }, 160);
    });
    G.lastPick = null;
    updateHUD();
    setTimeout(updateCovered, 280);
  }

  /* ---------- Build level ---------- */
  function assignTypes(cells, typeCount, rng=Math.random) {
    const n = cells.length;
    const bag = [];
    let type = 0;
    for (let i = 0; i < n; i += 3) {
      bag.push(type, type, type);
      type = (type + 1) % typeCount;
    }
    shuffle(bag, rng);
    return cells.map((c, i) => ({
      id: i,
      type: bag[i],
      col: c.col, row: c.row, layer: c.layer,
      status: "board",
      x: 0, y: 0, w: 56, h: 64,
      el: null
    }));
  }

  function startLevel(level) {
    G.level = level;
    G.slot = [];
    G.tools = { ...level.tools };
    G.combo = 0;
    G.score = 0;
    G.busy = false;
    G.lastPick = null;
    G.revived = false;
    G.over = false;
    G.startAt = Date.now();
    const rng = level.id === "daily" ? mulberry32(todaySeed()) : Math.random;
    const cells = level.layout();
    G.tiles = assignTypes(cells, level.typeCount, level.id === "daily" ? rng : Math.random);

    stage.innerHTML = "";
    $$(".slot-cell", slotTray).forEach(c => c.innerHTML = "");
    for (const t of G.tiles) stage.appendChild(createTileEl(t));
    showScreen("screen-game");
    void stage.offsetWidth;
    layoutTiles();
    updateCovered();
    updateHUD();
    requestAnimationFrame(() => { layoutTiles(); updateCovered(); });
    Sfx.startBgm();
    scheduleHint();
    if (level.id === "easy" && !Store.read().tut) {
      setTimeout(() => {
        openModal("how", true);
        Store.write({ tut: 1 });
      }, 400);
    }
  }

  /* ---------- Win / Lose ---------- */
  function starCount() {
    const used = (G.level.tools.undo - G.tools.undo) + (G.level.tools.remove - G.tools.remove) + (G.level.tools.shuffle - G.tools.shuffle);
    const t = (Date.now() - G.startAt) / 1000;
    let s = 3;
    if (used > 2 || t > 180) s = 2;
    if (used > 4 || t > 300 || G.revived) s = 1;
    if (G.revived && used > 3) s = 1;
    return s;
  }

  function victory() {
    G.over = true;
    Sfx.win();
    confetti();
    Store.setBest(G.level.id, G.score);
    const stars = starCount();
    Store.setStars(G.level.id, stars);
    const rec = Store.read();
    Store.write({ wins: (rec.wins || 0) + 1, plays: (rec.plays || 0) + 1 });
    const idx = LEVELS.findIndex(l => l.id === G.level.id);
    const next = LEVELS[idx + 1];
    openModal("win", false, { stars, next });
  }

  function defeat() {
    G.over = true;
    Sfx.lose();
    slotTray.classList.add("danger");
    const rec = Store.read();
    Store.write({ plays: (rec.plays || 0) + 1 });
    openModal("lose");
  }

  function openModal(kind, fromHow, extra={}) {
    const box = $("#modal");
    let html = "";
    if (kind === "how") {
      html = `<div class="panel">
        <div class="big">🐑</div>
        <h2>怎么玩</h2>
        <div class="how-list">
          1. 只可点击<strong>没被压住</strong>的牌<br/>
          2. 牌会飞进下方 <strong>7 格槽位</strong><br/>
          3. 相同的牌会<strong>靠在一起</strong>，凑齐 3 张消除<br/>
          4. 槽位满 7 张且无法消除即失败<br/>
          5. 道具：<strong>撤回</strong>上一步、<strong>移出</strong>槽内 3 张、<strong>洗牌</strong>打乱剩余图案
        </div>
        <div class="panel-actions">
          <button class="btn btn-main" id="m-ok">我明白了</button>
        </div>
      </div>`;
    } else if (kind === "pause") {
      html = `<div class="panel">
        <div class="big">⏸</div>
        <h2>暂停一下</h2>
        <p>牌堆还在，理智也要留着。</p>
        <div class="panel-actions">
          <button class="btn btn-main" id="m-resume">继续赶羊</button>
          <button class="btn btn-ghost" id="m-home">返回选关</button>
        </div>
      </div>`;
    } else if (kind === "win") {
      const starStr = "★★★☆☆☆".slice(3 - extra.stars, 6 - extra.stars);
      html = `<div class="panel">
        <div class="big">🎉</div>
        <h2>羊了个羊！</h2>
        <div class="stars-lg">${"★".repeat(extra.stars)}${"☆".repeat(3-extra.stars)}</div>
        <p>得分 ${G.score}　用时 ${Math.round((Date.now()-G.startAt)/1000)} 秒</p>
        <div class="panel-actions">
          ${extra.next ? `<button class="btn btn-main" id="m-next">下一关 · ${extra.next.name}</button>` : `<button class="btn btn-main" id="m-again">再羊一次</button>`}
          <button class="btn btn-ghost" id="m-home">返回选关</button>
        </div>
      </div>`;
    } else if (kind === "lose") {
      html = `<div class="panel">
        <div class="big">💥</div>
        <h2>槽位羊满为患</h2>
        <p>7 格已满，羊群堵在门口。<br/>还可以看一段「羊村广告」复活一次。</p>
        <div class="panel-actions">
          ${G.revived ? "" : `<button class="btn btn-main" id="m-ad">看广告复活</button>`}
          <button class="btn btn-ghost" id="m-again">重新开始</button>
          <button class="btn btn-ghost" id="m-home">返回选关</button>
        </div>
      </div>`;
    }
    box.innerHTML = html;
    box.classList.add("show");
    const close = () => box.classList.remove("show");
    const bind = (id, fn) => { const el = $("#"+id); if (el) el.onclick = fn; };
    bind("m-ok", close);
    bind("m-resume", close);
    bind("m-home", () => { close(); showScreen("screen-levels"); renderLevels(); });
    bind("m-again", () => { close(); startLevel(G.level); });
    bind("m-next", () => { close(); startLevel(extra.next); });
    bind("m-ad", () => { close(); playAd(); });
  }

  function playAd() {
    const ad = $("#ad-screen");
    ad.innerHTML = `
      <div class="ad-stage">
        <div class="ad-sheep">${SHEEP_SVG}</div>
        <div style="font-size:18px;font-weight:800">羊村特供广告</div>
        <div style="opacity:.7;font-size:13px">羊毛出在羊身上 · 本片由青草赞助</div>
        <div class="ad-bar"><i id="ad-fill"></i></div>
      </div>
      <button class="ad-skip" id="ad-skip" disabled>3 秒后可关闭</button>`;
    ad.classList.add("show");
    const fill = $("#ad-fill");
    void fill.offsetWidth;
    fill.classList.add("run");
    const skip = $("#ad-skip");
    let left = 3;
    const iv = setInterval(() => {
      left--;
      if (left > 0) skip.textContent = left + " 秒后可关闭";
      else {
        clearInterval(iv);
        skip.disabled = false;
        skip.classList.add("ready");
        skip.textContent = "关闭并复活";
      }
    }, 1000);
    skip.onclick = () => {
      if (skip.disabled) return;
      ad.classList.remove("show");
      revive();
    };
  }

  function revive() {
    G.over = false;
    G.revived = true;
    G.busy = false;
    const n = Math.min(3, G.slot.length);
    const gone = G.slot.splice(0, n);
    for (const t of gone) { t.status = "gone"; t.el.remove(); }
    G.tools.undo += 1;
    G.tools.remove += 1;
    renderSlot();
    updateCovered();
    updateHUD();
    toast("复活成功！清出 3 张，加油赶羊");
    scheduleHint();
  }

  /* ---------- UI screens ---------- */
  function renderLevels() {
    const list = $("#level-list");
    list.innerHTML = LEVELS.map(lv => {
      const st = Store.stars(lv.id);
      const best = Store.best(lv.id);
      return `<div class="level-card" data-id="${lv.id}">
        <div class="level-badge">${lv.emoji}</div>
        <div>
          <h3>${lv.name}</h3>
          <p>${lv.subtitle}</p>
          <div class="stars">${st ? "★".repeat(st)+"☆".repeat(3-st) : "☆☆☆"} ${best ? " · 最佳 "+best : ""}</div>
        </div>
        <div class="go-chip">进入</div>
      </div>`;
    }).join("");
    list.querySelectorAll(".level-card").forEach(card => {
      card.onclick = () => {
        const lv = LEVELS.find(l => l.id === card.dataset.id);
        startLevel(lv);
      };
    });
  }

  function refreshStats() {
    const s = Store.read();
    $("#stats-line").textContent = `已玩 ${s.plays || 0} 局 · 通关 ${s.wins || 0} 次`;
  }

  /* ---------- Bind ---------- */
  $("#hero-sheep").innerHTML = SHEEP_SVG;
  $("#btn-start").onclick = () => { Sfx.unlock(); renderLevels(); showScreen("screen-levels"); };
  $("#btn-how").onclick = () => { Sfx.unlock(); openModal("how"); };
  $("#btn-back-home").onclick = () => { refreshStats(); showScreen("screen-start"); };
  $("#btn-pause").onclick = () => openModal("pause");
  $("#btn-mute").onclick = () => {
    const m = Sfx.toggle();
    $("#btn-mute").textContent = m ? "🔇" : "🔊";
  };
  $("#tool-undo").onclick = useUndo;
  $("#tool-remove").onclick = useRemove;
  $("#tool-shuffle").onclick = useShuffle;

  window.addEventListener("resize", () => {
    resizeFx();
    if ($("#screen-game").classList.contains("active") && !G.over) {
      layoutTiles();
      updateCovered();
    }
  });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) Sfx.stopBgm();
    else if ($("#screen-game").classList.contains("active") && !Sfx.muted) Sfx.startBgm();
  });
  document.addEventListener("touchmove", (e) => {
    if (e.target.closest(".level-list")) return;
    e.preventDefault();
  }, { passive: false });

  resizeFx();
  refreshStats();
})();
</script>
</body>
</html>
